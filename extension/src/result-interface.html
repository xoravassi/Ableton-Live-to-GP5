<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export complete</title>
  <script>
    const resultData = JSON.parse(
      decodeURIComponent("__ABLETON_TO_GP5_RESULT_DATA__")
    );
    const isWebKitMessageHandlerAvailable =
      window.webkit &&
      window.webkit.messageHandlers &&
      window.webkit.messageHandlers.live;
    const isWebView2 = window.chrome && window.chrome.webview;

    function sendMessage(message) {
      if (isWebKitMessageHandlerAvailable) {
        window.webkit.messageHandlers.live.postMessage(message);
      } else if (isWebView2) {
        window.chrome.webview.postMessage(message);
      }
    }

    function closeWithAction(action) {
      sendMessage({
        method: "close_and_send",
        params: [JSON.stringify({ action })]
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("file-name").textContent = resultData.fileName;
      document.getElementById("folder-path").textContent = resultData.folder;
      document.getElementById("track-count").textContent =
        String(resultData.trackCount);
      document.getElementById("note-count").textContent =
        String(resultData.notesWritten);
      document.getElementById("track-label").textContent =
        resultData.trackCount === 1 ? "track exported" : "tracks exported";
      document.getElementById("note-label").textContent =
        resultData.notesWritten === 1 ? "note written" : "notes written";

      const hasWarnings =
        resultData.notesSkipped > 0 || resultData.verificationWarning;

      if (hasWarnings) {
        const warning = document.getElementById("result-warning");
        const details = [];

        document.querySelector("h1").textContent =
          "Export complete with warnings";
        document.querySelector(".status-mark").classList.add(
          "status-mark--warning"
        );

        if (resultData.notesSkipped > 0) {
          details.push(
            resultData.notesSkipped + " " +
              (resultData.notesSkipped === 1 ? "note was" : "notes were") +
              " not written"
          );
        }

        if (resultData.verificationWarning) {
          details.push(resultData.verificationWarning);
        }

        warning.textContent = details.join(". ") + ".";
        warning.hidden = false;
      }

      document.getElementById("close-button").addEventListener("click", () => {
        closeWithAction("close");
      });

      document
        .getElementById("open-folder-button")
        .addEventListener("click", () => {
          closeWithAction("open-folder");
        });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeWithAction("close");
        }
      });

      document.getElementById("open-folder-button").focus();
    });
  </script>
  <style media="not all">
    *, *::before, *::after {
      box-sizing: border-box;
    }

    * {
      margin: 0;
    }

    button {
      font: inherit;
    }

    :root {
      /* Ableton Live 12 "Twenty-Four Carat" semantic colors. */
      --live-desktop: #282828;
      --live-surface: #343434;
      --live-surface-area: #222222;
      --live-surface-highlight: #474645;
      --live-control: #1b1b1b;
      --live-display: #141414;
      --live-frame: #0d0d0d;
      --live-text: #e1c69c;
      --live-text-muted: #8c7f6c;
      --live-accent: #ffad56;
      --live-accent-hover: #ffdd9f;
      --live-selection: #ffdd9f;
      --live-on-text: #040404;
      --live-play: #00d38d;
      --live-alert: #e76942;

      --c-bg: var(--live-surface);
      --c-panel: var(--live-surface-area);
      --c-panel-raised: var(--live-desktop);
      --c-control: var(--live-control);
      --c-control-hover: var(--live-surface-highlight);
      --c-border: var(--live-frame);
      --c-outline: var(--live-selection);
      --c-text: var(--live-text);
      --c-text-secondary: var(--live-text-muted);
      --c-accent: var(--live-accent);
      --c-accent-hover: var(--live-accent-hover);
      --c-accent-text: var(--live-on-text);
      --c-success: var(--live-play);
      --c-warning: var(--live-alert);
    }

    html,
    body {
      height: 100%;
      background: var(--c-bg);
      color: var(--c-text);
      font-family: "Ableton Sans", "AbletonSansSmall", "Segoe UI", system-ui, sans-serif;
      font-size: 11px;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
    }

    body {
      overflow: hidden;
    }

    main {
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--c-border);
      background: var(--c-panel-raised);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 4%);
    }

    .status-mark {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      border: 1px solid var(--c-success);
      background: var(--c-success);
      box-shadow: inset 0 0 0 2px var(--c-panel-raised);
    }

    .status-mark--warning {
      border-color: var(--c-warning);
      background: var(--c-warning);
    }

    h1 {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .result {
      display: grid;
      align-content: center;
      gap: 10px;
      padding: 12px;
    }

    .file {
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--c-border);
      background: var(--c-panel);
      box-shadow: inset 0 1px 3px rgb(0 0 0 / 25%);
    }

    .file-name {
      overflow-wrap: anywhere;
      font-size: 12px;
      font-weight: 600;
    }

    .folder-path {
      margin-top: 4px;
      overflow-wrap: anywhere;
      color: var(--c-text-secondary);
    }

    .counts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--c-border);
      background: var(--c-panel);
      box-shadow: inset 0 1px 3px rgb(0 0 0 / 25%);
    }

    .result-warning {
      padding: 7px 9px;
      border: 1px solid var(--c-warning);
      color: var(--c-warning);
      background: var(--c-panel);
      line-height: 1.35;
    }

    .count {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: baseline;
      gap: 6px;
      padding: 8px 10px;
    }

    .count + .count {
      border-left: 1px solid var(--c-border);
    }

    .count-value {
      font-size: 16px;
      font-weight: 600;
      color: var(--c-success);
      font-variant-numeric: tabular-nums;
    }

    .count-label {
      color: var(--c-text-secondary);
    }

    footer {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      padding: 10px 12px;
      border-top: 1px solid var(--c-border);
      background: var(--c-panel-raised);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 3%);
    }

    .alx-button {
      min-width: 82px;
      height: 23px;
      padding: 0 11px;
      border: 1px solid var(--c-border);
      border-radius: 2px;
      outline: 0;
      background: var(--c-control);
      color: var(--c-text);
      cursor: pointer;
      white-space: nowrap;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 6%);
    }

    .alx-button:hover {
      background: var(--c-control-hover);
    }

    .alx-button:focus {
      border-color: var(--c-outline);
      outline: 0;
    }

    .alx-button--primary {
      background: var(--c-accent);
      color: var(--c-accent-text);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 25%);
    }

    .alx-button--primary:hover {
      background: var(--c-accent-hover);
    }

    .alx-button:active {
      translate: 0 1px;
      box-shadow: none;
    }
  </style>
  <style>__ABLETON_TO_GP5_UI_STYLES__</style>
</head>
<body>
  <div class="ui-shell">
    <main class="ui-frame result-layout">
      <header class="ui-header justify-start">
        <div class="status-mark" aria-hidden="true"></div>
        <div class="ui-title-group">
          <h1 class="ui-title">Export complete</h1>
          <p class="ui-description">
            The Guitar Pro 5 score has been written successfully.
          </p>
        </div>
      </header>

      <section class="ui-content result">
        <article class="file">
          <div class="file-name" id="file-name"></div>
          <div class="folder-path" id="folder-path"></div>
        </article>

        <div class="counts">
          <div class="count">
            <div class="count-value" id="track-count"></div>
            <div class="count-label" id="track-label"></div>
          </div>
          <div class="count">
            <div class="count-value" id="note-count"></div>
            <div class="count-label" id="note-label"></div>
          </div>
        </div>

        <div
          class="result-warning"
          id="result-warning"
          role="status"
          hidden
        ></div>
      </section>

      <footer class="ui-footer">
        <p class="text-xs text-muted-foreground">
          The JSON export and report are stored in the same folder.
        </p>
        <div class="ui-actions">
          <button
            class="ui-button ui-button-outline"
            id="close-button"
            type="button"
            data-slot="button"
          >
            Close
          </button>
          <button
            class="ui-button ui-button-primary"
            id="open-folder-button"
            type="button"
            data-slot="button"
          >
            Open folder
          </button>
        </div>
      </footer>
    </main>
  </div>
</body>
</html>
